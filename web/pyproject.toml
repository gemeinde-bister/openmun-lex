[project]
name = "openmun-lex"
version = "0.3.0"
description = "AKN law viewer with full-text search (federal, cantonal, municipal)"
requires-python = ">=3.12"
license = "EUPL-1.2"
authors = [
    { name = "Kevin Bortis" },
    { name = "Gemeinde Bister" },
]
dependencies = [
    "lxml",
    "starlette",
    "jinja2",
    "uvicorn",
    "httpx",
    "python-multipart",
    "openmun-opendata",
    "openmun-editor",
    "tantivy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_akn", "src/lex_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
