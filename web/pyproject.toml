[project]
name = "openmun-lex"
version = "0.3.2"
description = "AKN law viewer with full-text search (federal, cantonal, municipal)"
requires-python = ">=3.12"
license = "EUPL-1.2"
authors = [
    { name = "Kevin Bortis" },
    { name = "Gemeinde Bister" },
]
dependencies = [
    "lxml",
    "starlette",
    "jinja2",
    "uvicorn",
    "httpx",
    "python-multipart",
    "openmun-opendata",
    "openmun-editor",
    # Pinned: tantivy has no musllinux wheel, so an unpinned bump recompiles from source on the
    # (musl) prod host, and the on-disk index format is tied to the tantivy version it was built
    # with. Keep this == the version used to build search_index/ (index_format v7). See
    # rx repo docs/hosts/vm-mun0.md → "Lex Deployment".
    "tantivy==0.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_akn", "src/lex_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
