[project]
name = "openmun-lex-fedlex-sync"
version = "0.1.0"
description = "Sync federal law (Fedlex) AKN XML to local store"
requires-python = ">=3.12"
license = "EUPL-1.2"
authors = [
    { name = "Kevin Bortis" },
    { name = "Gemeinde Bister" },
]
dependencies = [
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-httpx",
]

[project.scripts]
fedlex-sync = "lex_fedlex_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_fedlex_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Live tests hit the Fedlex SPARQL endpoint; excluded from the default run.
# Opt in with: uv run pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: test that requires network access to the live Fedlex endpoint",
]
