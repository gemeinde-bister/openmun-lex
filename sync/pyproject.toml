[project]
name = "openmun-lex-sync"
version = "0.2.0"
description = "Sync lex.vs.ch cantonal law to local AKN XML store"
requires-python = ">=3.12"
license = "EUPL-1.2"
authors = [
    { name = "Kevin Bortis" },
    { name = "Gemeinde Bister" },
]
dependencies = [
    "httpx",
    "lxml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-httpx",
]

[project.scripts]
lex-sync = "lex_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lex_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
